# The main pipeline for Bundle2

resources:
  pipelines:
    Bundle2_etl:
      name: PipelinesBundleIncludesAll
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: ../src/PipelinesBundleIncludesAll

      libraries:
        - glob:
            include: ../src/PipelinesBundleIncludesAll/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
